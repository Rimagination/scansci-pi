[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scansci-pi"
version = "0.2.0"
description = "ScanSci research workbench powered by the Pi Agent SDK."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "cloakbrowser>=0.3.31",
  "keyring>=25.0",
  "litellm>=1.80,<2",
  "lxml>=5.0",
  "markitdown[all]>=0.1.3,<0.2",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "playwright>=1.40",
  "pydantic>=2.0",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pyzotero>=1.6,<2",
  "requests>=2.31",
  "sqlite-vec>=0.1.6,<0.2",
]

[project.optional-dependencies]
rerank = [
  "sentence-transformers>=5.1,<6.0",
  "sentencepiece>=0.2,<0.3",
]
ie-model = [
  "scikit-learn>=1.4",
  "torch>=2.0",
  "transformers>=4.40",
]
desktop = [
  "pywebview>=6.0,<7.0",
  "pyinstaller>=6.0,<7.0",
]
enhanced-document = [
  "docling>=2.70,<3",
]

[project.scripts]
scansci = "scansci_html.cli:main"
scansci-html = "scansci_html.cli:main"
scansci-desktop = "scansci_html.desktop:main"
scanscipi-desktop = "scansci_html.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scansci_html = ["web/*", "web/**/*", "builtin_skill_assets/*", "builtin_skill_assets/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
